# The rule table: a starter for a new project. Copy it to standards/rules.toml and adjust it there.
#
# The schema, the allowed values and which rule reads each section are in docs/rule-table.md. In short:
# - [[layer]] rows classify every package of the workspace by its build file (A1, A2, A10, A14);
# - the word and name lists ([words], [names], [decider], [banned], [packages], [primitives], [text], [glossary], [vocabulary]) are the
#   committed vocabularies the checks read;
# - [allow] holds every exception, each with a reason, the decision record it relaxes and a dated approval (F1, I2, I5);
# - the limit tables ([structure], [supply], [s5], [vision], [spikes], [quarantine], [i2], [f2], [f4], [e33], [range]) hold the numbers and
#   paths the structure, supply-chain and history checks read;
# - one [[rule]] row per rule: 157 rows, every one `planned` (or `process`) until its check and planted breach exist (F5). When a check
#   lands, add `checks = ["<check-id>", ...]` to the row: the ids in the check registry that hold the rule, which the meta-test compares
#   with the registry (every check is named by some row; every id a row names exists).
#
# This is a principle file (F4): it changes only by adding or tightening unless the commit cites a dated approval (`Owner-yes: YYYY-MM-DD`).
# Adding a rule, a banned word or a layer row is a tightening; removing one, or lowering a rule's status, is a loosening. A new rule takes
# the next id after the highest in its group, and a retired id is never reused. A commit that changes this file cites a decision record (I3).

# ---------------------------------------------------------------------------------------------------------------------------------------
# A1's layer table. Every package of the workspace has a row, found by the path of its build file relative to the workspace root; a package
# that matches no row fails A1. The FIRST row whose pattern matches is the package's row, so the order matters: a specific row (ImportHost)
# comes before the general one it would otherwise fall into (Host), and Breach comes before Test.
#
# Patterns are path globs, one list per build system; keep only the build system(s) the project uses:
#   cargo  = Cargo.toml (Rust)            maven  = pom.xml (Maven modules)         gradle = build.gradle.kts or build.gradle (Gradle modules)
#   npm    = package.json (npm workspaces) msbuild = *.csproj, *.fsproj, *.vbproj (.NET)
# In a pattern, {context} names a context of the context map (standards/contexts.toml) and must be the same wherever it appears in one
# pattern; {name} matches one path segment; * matches within one segment; ** matches any depth.
#
# references: the layers the row's packages may depend on. A target may be qualified: "Contracts:own" (the same context), "Contracts:upstream"
# (a context upstream of this one in the context map), "Contracts:any", "Application:any". "*" allows every reference (test packages).
# packages: the third-party packages the whole layer may use ("*" allows all; Test only). A10 narrows production packages one by one in
# [packages] below.

[[layer]]
name = "Kernel"
cargo = ["kernel/Cargo.toml"]
maven = ["kernel/pom.xml"]
gradle = ["kernel/build.gradle.kts", "kernel/build.gradle"]
npm = ["kernel/package.json"]
msbuild = ["kernel/*.*proj"]
references = []
packages = []

[[layer]]
name = "Contracts"
cargo = ["contexts/{context}/contracts/Cargo.toml"]
maven = ["contexts/{context}/contracts/pom.xml"]
gradle = ["contexts/{context}/contracts/build.gradle.kts", "contexts/{context}/contracts/build.gradle"]
npm = ["contexts/{context}/contracts/package.json"]
msbuild = ["contexts/{context}/contracts/*.*proj"]
references = ["Kernel", "Contracts:upstream"]
packages = []

[[layer]]
name = "Domain"
cargo = ["contexts/{context}/domain/Cargo.toml"]
maven = ["contexts/{context}/domain/pom.xml"]
gradle = ["contexts/{context}/domain/build.gradle.kts", "contexts/{context}/domain/build.gradle"]
npm = ["contexts/{context}/domain/package.json"]
msbuild = ["contexts/{context}/domain/*.*proj"]
references = ["Kernel", "Contracts:own", "Contracts:upstream"]
packages = []

[[layer]]
name = "Codec"
cargo = ["contexts/{context}/codec/Cargo.toml"]
maven = ["contexts/{context}/codec/pom.xml"]
gradle = ["contexts/{context}/codec/build.gradle.kts", "contexts/{context}/codec/build.gradle"]
npm = ["contexts/{context}/codec/package.json"]
msbuild = ["contexts/{context}/codec/*.*proj"]
references = ["Kernel", "Contracts:own", "Domain:own"]
packages = []

[[layer]]
name = "Application"
cargo = ["contexts/{context}/application/Cargo.toml"]
maven = ["contexts/{context}/application/pom.xml"]
gradle = ["contexts/{context}/application/build.gradle.kts", "contexts/{context}/application/build.gradle"]
npm = ["contexts/{context}/application/package.json"]
msbuild = ["contexts/{context}/application/*.*proj"]
references = ["Kernel", "Infrastructure", "Domain:own", "Codec:own", "Contracts:own", "Contracts:upstream"]
packages = []

# The one thin cross-context composition package (A14), which schedules work across the context applications. The guide's examples call
# it `Day`, after the reference code base's daily cycle; name it after what it schedules. It may name Kernel and any context's Contracts
# (in languages that reach a type only through a direct dependency), but never a Domain package or an Infrastructure wrapper.
[[layer]]
name = "Composition"
cargo = ["composition/Cargo.toml"]
maven = ["composition/pom.xml"]
gradle = ["composition/build.gradle.kts", "composition/build.gradle"]
npm = ["composition/package.json"]
msbuild = ["composition/*.*proj"]
references = ["Application:any", "Contracts:any", "Kernel"]
packages = []

[[layer]]
name = "Infrastructure"
cargo = ["infrastructure/{name}/Cargo.toml"]
maven = ["infrastructure/{name}/pom.xml"]
gradle = ["infrastructure/{name}/build.gradle.kts", "infrastructure/{name}/build.gradle"]
npm = ["infrastructure/{name}/package.json"]
msbuild = ["infrastructure/{name}/*.*proj"]
references = ["Kernel"]
packages = []

# Import and ImportHost apply only when reimplementing a reference program (A7): Import alone knows the legacy format, and its host is the
# one program that may reference it. Delete both rows otherwise. ImportHost comes before Host, whose pattern would also match its path.
[[layer]]
name = "Import"
cargo = ["import/Cargo.toml"]
maven = ["import/pom.xml"]
gradle = ["import/build.gradle.kts", "import/build.gradle"]
npm = ["import/package.json"]
msbuild = ["import/*.*proj"]
references = ["Kernel", "Contracts:any"]
packages = []

[[layer]]
name = "ImportHost"
cargo = ["hosts/import/Cargo.toml"]
maven = ["hosts/import/pom.xml"]
gradle = ["hosts/import/build.gradle.kts", "hosts/import/build.gradle"]
npm = ["hosts/import/package.json"]
msbuild = ["hosts/import/*.*proj"]
references = ["Kernel", "Contracts:any", "Import", "Composition"]
packages = []

[[layer]]
name = "Host"
cargo = ["hosts/{name}/Cargo.toml"]
maven = ["hosts/{name}/pom.xml"]
gradle = ["hosts/{name}/build.gradle.kts", "hosts/{name}/build.gradle"]
npm = ["hosts/{name}/package.json"]
msbuild = ["hosts/{name}/*.*proj"]
references = ["Application:any", "Composition", "Infrastructure"]
packages = []

# The planted breaches (F5): each a tiny package or fixture that breaks exactly one rule. Excluded from the production build; nothing
# depends on them. Before Test, so that a breach under a tests/ path is still a breach.
[[layer]]
name = "Breach"
cargo = ["breaches/**"]
maven = ["breaches/**"]
gradle = ["breaches/**"]
npm = ["breaches/**"]
msbuild = ["breaches/**"]
references = []
packages = []

# E3 narrows what each kind of test package may reference.
[[layer]]
name = "Test"
cargo = ["tests/{name}/Cargo.toml"]
maven = ["tests/{name}/pom.xml"]
gradle = ["tests/{name}/build.gradle.kts", "tests/{name}/build.gradle"]
npm = ["tests/{name}/package.json"]
msbuild = ["tests/{name}/*.*proj"]
references = ["*"]
packages = ["*"]

# ---------------------------------------------------------------------------------------------------------------------------------------
# A9: no word of these lists in a type, module or namespace of Domain or Contracts, or in an Application port. Matched case-sensitively as
# a word of the name (SqlOrder, OrderJson), so add the casings the language's naming convention produces.
[words]
infrastructure = ["Sql", "Json", "Http", "Socket", "File", "Db", "Clock", "Thread", "Cache", "Queue"]
screens = ["Button", "Click", "Screen", "Page"]

# B22: no module, file, type or top-level function of Domain, Contracts or Application is named with, or ends in, one of `vague`, unless
# the whole name is a glossary term. B7: domain events are named in the past tense: ending in "ed", or ending in one of `past_irregular`.
[names]
vague = ["Entities", "ValueObjects", "Services", "Factories", "Repositories", "Helpers", "Utils", "Common", "Shared", "Misc", "Base", "Impl", "Processor", "Handler", "Data", "Info", "Manager"]
past_irregular = ["Sold", "Bought", "Lost", "Won", "Left", "Paid", "Sent", "Built", "Made", "Began", "Broke", "Kept", "Put", "Set", "Cut", "Hit", "Shot", "Taken", "Given", "Written", "Chosen", "Drawn"]

# B3: the leading parameters a `decide` may take before the command and the state, by simple type name: the closed list of everything a
# decision may read besides them. List your own, by simple type name, and nothing else: typically the kernel's domain date (D13), and,
# when decisions draw randomness or read a rules section, the kernel's view of the seeded random stream (D2) and that rules type. Empty
# until the first decider exists; B3 reads it.
[decider]
leading = []
# leading = ["Date", "RandomView", "Rules"]

# A10: dependency-injection containers, banned everywhere (the Hosts wire the system by passing functions). E1: mocking libraries, banned
# in every package (tests double with Nullable wrappers, E5). Names as the build file names them; keep the ecosystems you use.
[banned]
containers = [
    # .NET
    "Microsoft.Extensions.DependencyInjection", "Autofac", "SimpleInjector", "Ninject", "Castle.Windsor", "Lamar", "DryIoc", "StructureMap", "Unity.Container",
    # JVM (group:artifact)
    "com.google.inject:guice", "com.google.dagger:dagger", "org.springframework:spring-context",
    # npm
    "inversify", "tsyringe", "awilix", "typedi",
    # Rust
    "shaku",
]
mocking = [
    # .NET
    "Moq", "NSubstitute", "FakeItEasy", "Foq", "JustMock",
    # JVM (group:artifact)
    "org.mockito:mockito-core", "org.easymock:easymock", "io.mockk:mockk", "org.jmock:jmock",
    # npm
    "sinon", "testdouble", "ts-mockito", "jest-mock-extended",
    # Rust
    "mockall", "faux", "mocktopus",
]

# A10: each production package's third-party packages, by package name. A package appears under its one wrapper; its licence and the
# reason for it are recorded in the commit that adds it (H4). Adding an entry needs a dated approval in the comment above it.
[packages]
# An example, commented out: the store's one database driver, behind its wrapper only (licence and reason in the adopting commit).
# Owner-yes: YYYY-MM-DD
# orderstore = ["<group:artifact or package name of the driver>"]

# C4: raw primitives allowed in Domain and Contracts signatures, by full type name. Empty: wrap them in constrained types (C3).
[primitives]
allowed = []

# D5: the string literals Kernel, Domain and Contracts may hold, as identifiers and keys. Empty: words come from text resources at the edge.
[text]
keys = []

# B4: names that are not glossary terms, by exact name or by a trailing * (a prefix).
[glossary]
generic = []

# B13 checks the context map's fields against these closed vocabularies, and B1 its relation kinds.
[vocabulary]
subdomain = ["core", "supporting", "generic"]
status = ["implemented", "sample", "planned"]
logic = ["transaction-script", "active-record", "domain-model", "event-sourced"]
architecture = ["layered", "ports-and-adapters", "cqrs"]
relation_kind = ["published-language", "open-host-service", "customer-supplier", "conformist", "anticorruption-layer", "shared-kernel", "partnership", "separate-ways"]

# ---------------------------------------------------------------------------------------------------------------------------------------
# Exceptions. Every exception to a rule is an entry here, never a private skip list inside a check. Each entry names the rule, the exact
# member or file (no wildcards), the reason, the decision record it relaxes (I2) and the dated approval; `review_by` is optional and fails
# the gate once it lapses, and an entry that no longer matches any violation fails the gate (I5). A quarantined flaky test is an entry with
# `expires` at most [quarantine].max_days after its approval (E30). The lists, by the rule that reads each:
[allow]
general = []             # I5: any rule's finding, as { rule, file, member, reason, record, owner_yes, review_by }
wildcard = []            # C12: unions a catch-all case may cover
custom_equality = []     # B9: types with custom equality, ordering or hashing (each with its law properties)
struct_constrained = []  # C3: constrained types whose default zero value is legal, with why
same_entry = []          # B12: several aggregates' events in one journal entry outside jobs and registered policies
states_as_flags = []     # C8: records excused from the states-as-types report
warnings_kept = []       # F1, H5: warnings kept as warnings (for example the package audit's, judged by the nightly audit instead)
quarantine = []          # E30: flaky tests, with `expires`
readers = []             # I5: the rules whose checks read this table; an entry for a rule not listed here matches nothing and is refused
# One example entry (I2, I5): uncomment, and add the rule's id to `readers` when its check reads the table.
# general = [
#     { rule = "A6", file = "contexts/orders/domain/<path to the source file>", member = "<the exact type or function>", reason = "a mutually recursive pair the language allows inside one package; split when the pricing rules are rewritten", record = "D-0007", owner_yes = "YYYY-MM-DD", review_by = "YYYY-MM-DD" },
# ]

# ---------------------------------------------------------------------------------------------------------------------------------------
# The numbers and paths the structure, supply-chain and history checks read. The reference code base kept the history numbers in a file of
# their own (history.toml) and the structure numbers in its linter configuration; one table is enough. Keys that start with `max` loosen
# when they grow (F4).

# G3, G4, G11, A17: complexity and size. Complexity is cyclomatic, or the stricter cognitive measure where that is what the tooling offers.
[structure]
max_complexity = 15
max_complexity_shell = 5        # A17: Application, Composition and Host functions
max_nesting = 4
max_function_lines = 80
max_module_lines = 500
max_file_lines = 600
max_parameters = 4              # G11: public functions; records bundle anything more
max_same_primitive_parameters = 2  # G11: 3 or more parameters of one primitive type fail (smart constructors excepted)
domain_literals = [0, 1, -1]    # G7: the only unnamed numeric literals Domain may hold outside its rules module
# B25: an aggregate state's collection-typed fields; the reference left this number to be set once the report has data.
# max_aggregate_collections = 0

# H4: a pinned version was published at least this many days before the commit that adopts it.
[supply]
min_age_days = 14

# The commit rules (B24, E12, E23, F4, I3, R5, S5, B26) read the commits from `since` to HEAD: set it to the commit that precedes the
# commit adding the history check, so that nothing from before the rules existed is judged. It never moves later (F4).
[range]
since = ""

# S5: a branch holds at most this many changed lines, summed over its commits (generated files excluded), and is merged within this many
# hours, unless a commit of the branch cites a dated approval.
[s5]
max_changed_lines = 400
max_hours = 24
generated = ["standards/*.surface.txt", "standards/union-shapes.txt", "**/Cargo.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/packages.lock.json", "**/gradle.lockfile"]

# B26: the product vision is under about this many words and names none of these technologies.
[vision]
max_words = 400
technology = ["SQL", "JSON", "TOML", "HTTP", "API", "database", "socket", "browser", "Docker", "Linux", "Windows", "WebAssembly"]

# S8: a spike folder older than this many days (its name's date against the head commit's date) is deleted.
[spikes]
max_days = 14

# E30: a quarantine expires at most this many days after its approval.
[quarantine]
max_days = 7

# I2: decision records from this number on carry a "Revisit when" line. 1 for a new project: every record does.
[i2]
revisit_from = 1

# F2: no tracked file has one of these extensions or is larger than max_bytes. Add the reference product's own file types.
[f2]
extensions = [".exe", ".dll", ".bin", ".zip", ".7z"]
max_bytes = 2097152

# F4: `principle` files change only by adding or tightening unless the commit cites a dated approval; `structural` files change only by a
# commit that cites a decision record; `append_only` paths never lose or change a line; P15's union shape files only gain cases at the end.
[f4]
principle = ["standards/rules.toml", "standards/budgets.toml", "standards/rubrics/**"]
structural = ["standards/contexts.toml", "standards/glossary.md", "standards/policies.toml"]
append_only = ["standards/review-cases/**", "tests/golden/**", "corpus/**", "migrations/**"]
append_only_shapes = ["standards/union-shapes.txt"]

# E33: approval files (`*.approved.*`) live only under a folder of one of these names; `*.received.*` files are never committed.
[e33]
approval_folders = ["approvals", "snapshots"]

# ---------------------------------------------------------------------------------------------------------------------------------------
# The rules. Fields (docs/rule-table.md): id, group, title; kind (Q, L, Q+L, report, process); cadence (commit, nightly, on-demand);
# extent (atomic, holistic); applies_to (layers or areas); characteristics and family (I1); check (the runner that owns the check:
# architecture, history, inventory, supply, review, meta, mutation, release, report, process); reimplementation ("whole" or "clause" for
# the rules that apply only when reimplementing a reference program); origin = "guide" for the two rules the guide adds; status (planned,
# dormant, partial, built, review, report, process). Optional, added as the work goes: checks (the check ids that hold the rule, on one
# line), record, milestone, dormant_until, <runner>_dormant_until, parts_pending.
#
# Rows are in the guide's adoption order (groups F, H, I, A, C, D, G, E, B, M, P, R, S, V), so that adopting from the top follows it.
# Missing ids (A3, A4, B2, ...) were retired in the reference code base and are not reused.

