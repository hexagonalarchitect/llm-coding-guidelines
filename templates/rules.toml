group = "F"
title = "Warnings are errors"
kind = "Q"
cadence = "commit"
extent = "atomic"
applies_to = "all production packages (tests may relax listed warnings by allow entry)"
characteristics = ["evolvability"]
family = "house"
check = "architecture"
status = "planned"

