# Every version is pinned here and nowhere else (H1).
[versions]
junit = "5.11.4"
jqwik = "1.9.2"
archunit = "1.4.1"
gson = "2.11.0"
mockito = "5.14.2"          # used ONLY by the E1 breach, to prove the no-mocking check fires
errorprone = "2.36.0"
nullaway = "0.12.4"
pitest-core = "1.17.4"
pitest-junit5 = "1.2.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-testkit = { module = "org.junit.platform:junit-platform-testkit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version = "4.1.0" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
